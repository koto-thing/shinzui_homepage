<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHINZUI</title>
  </head>
  <body class="bg-neutral-50 text-neutral-900 dark:bg-neutral-950 dark:text-neutral-50 antialiased selection:bg-neutral-200 dark:selection:bg-neutral-800">
    <div id="app" class="flex flex-col min-h-screen">
      <!-- JavaScript will inject the Header here -->
      
      <!-- Main Scrollable Sections -->
      <main class="flex-grow">
        <!-- ホーム -->
        <section id="home" class="min-h-screen flex items-center justify-center pt-16 bg-gradient-to-b from-neutral-100 to-white dark:from-neutral-900 dark:to-neutral-950">
          <div class="max-w-3xl text-center px-4">
            <h2 class="text-4xl sm:text-6xl font-black tracking-tight mb-6">SHINZUI ホーム</h2>
            <p class="text-lg text-neutral-600 dark:text-neutral-400">ここにホームページのメインビジュアルやイントロダクションが入ります。</p>
          </div>
        </section>

        <!-- おしらせ -->
        <section id="news" class="min-h-screen flex items-center justify-center pt-16 border-t border-neutral-200 dark:border-neutral-800">
          <div class="max-w-3xl text-center px-4">
            <h2 class="text-4xl font-bold tracking-tight mb-6">おしらせ</h2>
            <p class="text-lg text-neutral-600 dark:text-neutral-400">最新情報やパッチノートなどがここに掲載されます。</p>
          </div>
        </section>

        <!-- あそびかた -->
        <section id="play" class="min-h-screen flex items-center justify-center pt-16 bg-neutral-100 dark:bg-neutral-900 border-t border-neutral-200 dark:border-neutral-800">
          <div class="max-w-3xl text-center px-4">
            <h2 class="text-4xl font-bold tracking-tight mb-6">あそびかた</h2>
            <p class="text-lg text-neutral-600 dark:text-neutral-400">ゲームのルールや操作方法、基本的な遊び方を解説します。</p>
          </div>
        </section>

        <!-- ギャラリー -->
        <section id="gallery" class="min-h-screen flex items-center justify-center pt-16 border-t border-neutral-200 dark:border-neutral-800">
          <div class="max-w-3xl text-center px-4">
            <h2 class="text-4xl font-bold tracking-tight mb-6">ギャラリー</h2>
            <p class="text-lg text-neutral-600 dark:text-neutral-400">スクリーンショットやコンセプトアートを展示します。</p>
          </div>
        </section>

        <!-- サポート -->
        <section id="support" class="min-h-screen flex items-center justify-center pt-16 bg-neutral-100 dark:bg-neutral-900 border-t border-neutral-200 dark:border-neutral-800">
          <div class="max-w-3xl text-center px-4">
            <h2 class="text-4xl font-bold tracking-tight mb-6">サポート</h2>
            <p class="text-lg text-neutral-600 dark:text-neutral-400">お問い合わせ窓口や、よくある質問（FAQ）を掲載します。</p>
          </div>
        </section>

        <!-- ダウンロード -->
        <section id="download" class="min-h-screen flex items-center justify-center pt-16 border-t border-neutral-200 dark:border-neutral-800">
          <div class="max-w-3xl text-center px-4">
            <h2 class="text-4xl font-bold tracking-tight mb-6">ダウンロード</h2>
            <p class="text-lg text-neutral-600 dark:text-neutral-400">最新バージョンのダウンロードリンクやシステム要件です。</p>
          </div>
        </section>
      </main>

      <!-- 共通フッター -->
      <footer class="border-t border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-950 py-8 text-center text-sm text-neutral-500">
        <p>&copy; 2026 SHINZUI. All rights reserved.</p>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
